<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Todo App — Node + MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <main class="mx-auto max-w-xl px-5 py-12">
      <header class="mb-8">
        <p class="text-xs font-semibold text-emerald-700">todo-api · MongoDB Atlas en vivo</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">Mis Tareas</h1>
        <p class="mt-1 text-sm text-slate-600">
          Cada cambio aquí viaja a tu API en Express y se guarda en MongoDB Atlas.
        </p>
      </header>

      <!-- Formulario para crear tarea -->
      <form id="task-form" class="flex gap-2">
        <input
          id="task-input"
          type="text"
          placeholder="Escribe una nueva tarea..."
          class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm shadow-xs focus:border-emerald-600 focus:outline-none"
          required
        />
        <button
          type="submit"
          class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-800"
        >
          Agregar
        </button>
      </form>

      <p id="status-msg" class="mt-3 text-xs text-slate-500"></p>

      <!-- Aquí JavaScript dibujará el Array de tareas -->
      <ul id="task-list" class="mt-6 divide-y divide-slate-200 rounded-xl border border-slate-200 bg-white"></ul>
    </main>

    <script>
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const list = document.getElementById('task-list');
      const statusMsg = document.getElementById('status-msg');

      // 1. Pedir todas las tareas a Express (GET /tasks)
      async function cargarTareas() {
        const res = await fetch('/tasks');
        const tasks = await res.json(); // Esto es un Array [ ] de Objetos { }
        statusMsg.textContent = `${tasks.length} tareas en MongoDB Atlas`;
        dibujarLista(tasks);
      }

      // 2. Dibujar cada Objeto { } en pantalla
      function dibujarLista(tasks) {
        if (tasks.length === 0) {
          list.innerHTML = '<li class="p-6 text-center text-sm text-slate-400">No hay tareas todavía.</li>';
          return;
        }
        list.innerHTML = '';
        tasks.forEach((task) => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between gap-3 px-4 py-3.5';

          const left = document.createElement('button');
          left.type = 'button';
          left.className = 'flex flex-1 items-center gap-3 text-left';
          left.onclick = () => cambiarEstado(task);

          const check = document.createElement('span');
          check.className = task.completed
            ? 'flex h-5 w-5 items-center justify-center rounded border border-emerald-600 bg-emerald-600 text-xs text-white'
            : 'h-5 w-5 rounded border border-slate-300 bg-white';
          check.textContent = task.completed ? '✓' : '';

          const text = document.createElement('span');
          text.className = task.completed ? 'text-sm text-slate-400 line-through' : 'text-sm font-medium text-slate-800';
          text.textContent = task.title;

          left.append(check, text);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = 'Eliminar';
          delBtn.className = 'rounded-md px-2.5 py-1 text-xs font-medium text-red-600 hover:bg-red-50';
          delBtn.onclick = () => eliminarTarea(task._id);

          li.append(left, delBtn);
          list.appendChild(li);
        });
      }

      // 3. Crear tarea nueva (POST /tasks)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = input.value.trim();
        if (!title) return;

        await fetch('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        input.value = '';
        await cargarTareas();
      });

      // 4. Marcar completada / pendiente (PUT /tasks/:id)
      async function cambiarEstado(task) {
        await fetch(`/tasks/${task._id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: task.title, completed: !task.completed }),
        });
        await cargarTareas();
      }

      // 5. Borrar tarea (DELETE /tasks/:id)
      async function eliminarTarea(id) {
        await fetch(`/tasks/${id}`, { method: 'DELETE' });
        await cargarTareas();
      }

      cargarTareas();
    </script>
  </body>
</html>
