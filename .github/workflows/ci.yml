name: CI todo-api

# Cuándo se ejecuta este robot automático
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-and-build:
    # Sistema operativo virtual gratuito donde corre la prueba
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga tu código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala Node.js 24 con caché de npm para que sea rápido
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # 3. Instala dependencias exactas (incluye jest y supertest)
      - name: Install dependencies
        run: npm ci

      # 4. Ejecuta tus tests de Jest
      - name: Run tests
        run: npm test

      # 5. Verifica que la imagen de Docker compila sin errores
      - name: Build Docker image
        run: docker build -t todo-api:ci .
